name: Daily TCM Prescription Collection

on:
  schedule:
    - cron: '1 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate daily report
        run: python3 scripts/collect_daily.py
      - name: Commit report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update daily tcm collection report'
          file_pattern: data/daily-report.json
